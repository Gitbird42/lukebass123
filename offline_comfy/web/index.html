<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Flow</title>
<style>
:root{--bg:#14171c;--panel:#1d222a;--line:#2e3540;--fg:#e6e9ee;--mut:#8b95a5;--acc:#3fb6a8;--bad:#e5656b}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f7;--panel:#fff;--line:#d5dae1;--fg:#1b2027;--mut:#5d6878;--acc:#0f8a7c;--bad:#c4343b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}
select,button,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button.run{background:var(--acc);color:#fff;border-color:var(--acc)}button:disabled{opacity:.5}
main{flex:1;display:flex;min-height:0}
#view{flex:1;position:relative;overflow:hidden;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 0 8px;cursor:default}
.node h3{margin:0;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0}
.node.bypass{opacity:.45;border-style:dashed}.node.missing h3{color:var(--bad)}
.node label{display:block;padding:4px 10px 0;font-size:11px;color:var(--mut)}
.node input,.node textarea{width:calc(100% - 20px);margin:2px 10px 0}
.node textarea{height:90px;resize:vertical}.ports{padding:4px 10px;font-size:11px;color:var(--mut)}
aside{width:340px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside h2{font-size:13px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
#imgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}#imgs img{width:100%;border-radius:6px;border:1px solid var(--line)}
#log{height:150px;overflow:auto;font:12px ui-monospace,monospace;padding:8px 12px;border-top:1px solid var(--line);white-space:pre-wrap;color:var(--mut)}
@media(max-width:720px){main{flex-direction:column}aside{width:auto;height:45%;border-left:0;border-top:1px solid var(--line)}}
#simple{width:380px;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:6px}
#simple h2{margin:0 0 6px;font-size:17px}#simple label{color:var(--mut);font-size:12px;margin-top:6px}#simple textarea{height:90px;resize:vertical}
button.big{font-size:16px;padding:12px;margin-top:14px}[hidden]{display:none!important}
@media(max-width:720px){#simple{width:auto}}
</style></head><body>
<header><h1>Offline Flow</h1><button id="mode">Advanced view</button>
<select id="wf"></select><button id="load">Open</button>
<label><input type="checkbox" id="rnd"> new seeds</label>
<button class="run" id="run">Run</button><button id="save">Save as copy</button><span id="msg" style="color:var(--mut)"></span></header>
<main><div id="simple"><h2>Describe your image</h2>
<label>What do you want?</label><textarea id="s_pos" placeholder="e.g. minimal flat logo, mountain and sun, teal and cream"></textarea>
<label>What should it avoid? (optional)</label><textarea id="s_neg"></textarea>
<label>Shape</label><select id="s_size"><option value="512x512">Square</option><option value="768x512">Wide</option><option value="512x768">Tall</option><option value="768x768">Large square</option></select>
<label>Quality: <span id="s_q">20</span> steps (more = slower, usually cleaner)</label><input type="range" id="s_steps" min="8" max="50" value="20">
<label>Creativity (how closely it follows your words): <span id="s_c">7</span></label><input type="range" id="s_cfg" min="1" max="15" step=".5" value="7">
<button class="run big" id="gen">Generate</button><p id="s_hint" style="color:var(--mut)"></p></div>
<div id="view" hidden><div id="world"><svg id="links" width="1" height="1"></svg></div></div>
<aside><h2>Results</h2><div id="imgs"></div><div id="log"></div></aside></main>
<script>
const $=id=>document.getElementById(id);
let raw=null, view=null, edits={}, pan={x:40,y:40,k:.7};
const api=(p,o)=>fetch(p,o).then(r=>r.json());
const say=t=>$('msg').textContent=t;
function xf(){$('world').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${pan.k})`}
async function list(){const n=await api('/api/workflows');$('wf').innerHTML=n.map(x=>`<option>${x}</option>`).join('')}
var open_=async function open_(){
  const name=$('wf').value; if(!name) return;
  const d=await api('/api/workflow?name='+encodeURIComponent(name));
  if(d.error){say(d.error);return}
  raw=d.raw; view=d.view; edits={}; draw(); say(d.builtin?'built-in (read-only; Save makes a copy)':'your copy');
}
function draw(){
  const w=$('world'); [...w.querySelectorAll('.node')].forEach(e=>e.remove());
  const pos={};
  for(const n of view.nodes){
    const el=document.createElement('div');
    el.className='node'+(n.mode==4?' bypass':'')+(n.implemented?'':' missing');
    el.style.cssText=`left:${n.pos[0]}px;top:${n.pos[1]}px;width:${Math.max(n.size[0],240)}px`;
    el.innerHTML=`<h3>#${n.id} ${n.type}${n.mode==4?' (bypassed)':''}${n.implemented?'':' - not implemented'}</h3>`;
    for(const [k,v] of Object.entries(n.widgets)){ 
      if(k=='control_after_generate') continue;
      const l=document.createElement('label'); l.textContent=k; el.appendChild(l);
      const long=typeof v=='string'&&v.length>40;
      const i=document.createElement(long?'textarea':'input'); i.value=edits[n.id]?.[k]??v;
      i.oninput=()=>{const num=typeof v=='number'; (edits[n.id]??={})[k]=num?Number(i.value):(typeof v=='boolean'?i.value=='true':i.value)};
      el.appendChild(i);
    }
    const p=document.createElement('div'); p.className='ports';
    p.textContent=n.inputs.map(x=>x[0]).join(', ')+(n.inputs.length&&n.outputs.length?'  →  ':'')+n.outputs.join(', '); el.appendChild(p);
    w.appendChild(el); pos[n.id]=[n.pos[0],n.pos[1],el.offsetWidth,el.offsetHeight];
  }
  const svg=$('links'); svg.innerHTML='';
  for(const [,a,as,b,bs] of view.links){
    if(!pos[a]||!pos[b]) continue;
    const x1=pos[a][0]+pos[a][2], y1=pos[a][1]+20+as*14, x2=pos[b][0], y2=pos[b][1]+20+bs*14, dx=Math.abs(x2-x1)/2+30;
    svg.insertAdjacentHTML('beforeend',`<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" stroke="var(--acc)" stroke-width="2" opacity=".7"/>`);
  }
  fit(pos);
}
let lastPos=null;
function fit(pos){
  lastPos=pos||lastPos; const v=$('view'); if(!lastPos||!v.clientWidth) {xf();return}
  const a=Object.values(lastPos), x0=Math.min(...a.map(p=>p[0])), y0=Math.min(...a.map(p=>p[1])), x1=Math.max(...a.map(p=>p[0]+p[2])), y1=Math.max(...a.map(p=>p[1]+p[3]));
  pan.k=Math.min(1,.95*v.clientWidth/(x1-x0),.95*v.clientHeight/(y1-y0)); pan.x=(v.clientWidth-(x1-x0)*pan.k)/2-x0*pan.k; pan.y=(v.clientHeight-(y1-y0)*pan.k)/2-y0*pan.k; xf();
}
function merged(){ // raw workflow with edits applied (named widgets), never touching the stored original
  const c=JSON.parse(JSON.stringify(raw));
  for(const n of c.nodes||[]){const e=edits[n.id]; if(e) n.widgets_values_named={...(n.widgets_values_named||view.nodes.find(x=>x.id==n.id).widgets),...e}}
  return c;
}
async function run(){
  $('run').disabled=true; $('imgs').innerHTML=''; $('log').textContent='';
  const r=await api('/api/run',{method:'POST',body:JSON.stringify({workflow:raw,overrides:edits,randomize:$('rnd').checked})});
  if(r.error){say(r.error);$('run').disabled=false;return}
  for(;;){
    await new Promise(r=>setTimeout(r,700));
    const j=await api('/api/job?id='+r.id); $('log').textContent=j.log.join('\n'); $('log').scrollTop=1e9; say(j.status);
    if(j.status=='done'){$('imgs').innerHTML=j.images.map(p=>`<img src="/api/image?path=${encodeURIComponent(p)}&t=${Date.now()}">`).join('');break}
    if(j.status=='error'){$('log').textContent+='\n'+j.error;break}
  }
  $('run').disabled=false;
}
async function save(){
  if(!raw) return;
  const r=await api('/api/save',{method:'POST',body:JSON.stringify({name:$('wf').value,workflow:merged()})});
  say(r.error||('saved copy: '+r.name)); await list(); if(r.name) $('wf').value=r.name;
}
$('load').onclick=()=>open_(); $('run').onclick=run; $('save').onclick=save; $('wf').onchange=()=>open_();
const v=$('view'); let drag=null;
v.onmousedown=e=>{if(e.target.closest('.node'))return;drag=[e.clientX-pan.x,e.clientY-pan.y]};
addEventListener('mousemove',e=>{if(drag){pan.x=e.clientX-drag[0];pan.y=e.clientY-drag[1];xf()}});
addEventListener('mouseup',()=>drag=null);
v.onwheel=e=>{e.preventDefault();const k=Math.min(2,Math.max(.2,pan.k*(e.deltaY<0?1.1:.9)));pan.x=e.offsetX-(e.offsetX-pan.x)*k/pan.k;pan.y=e.offsetY-(e.offsetY-pan.y)*k/pan.k;pan.k=k;xf()};
let simple=true;
function find(){ // locate the nodes Simple mode drives
  const ks=view.nodes.find(n=>n.type=='KSampler'), lat=view.nodes.find(n=>n.type=='EmptyLatentImage'), r={ks,lat};
  for(const l of view.links){const t=view.nodes.find(n=>n.id==l[3]); if(t==ks){const nm=ks.inputs[l[4]]?.[0]; if(nm=='positive')r.pos=l[1]; if(nm=='negative')r.neg=l[1]}}
  return r;
}
const ed=(id,k,v)=>{(edits[id]??={})[k]=v};
function fillSimple(){
  const f=find(), g=(id,k)=>edits[id]?.[k]??view.nodes.find(n=>n.id==id)?.widgets[k];
  const ok=f.ks&&f.lat&&f.pos!=null&&f.neg!=null; $('gen').disabled=!ok;
  $('s_hint').textContent=ok?'Tip: use Advanced view to see or tweak the full node graph.':'This workflow is not a standard text-to-image graph - open Advanced view.';
  if(!ok) return;
  $('s_pos').value=g(f.pos,'text')||''; $('s_neg').value=g(f.neg,'text')||'';
  $('s_size').value=g(f.lat.id,'width')+'x'+g(f.lat.id,'height');
  $('s_steps').value=g(f.ks.id,'steps'); $('s_q').textContent=$('s_steps').value;
  $('s_cfg').value=g(f.ks.id,'cfg'); $('s_c').textContent=$('s_cfg').value;
}
function bindSimple(){
  const f=()=>find();
  $('s_pos').oninput=e=>ed(f().pos,'text',e.target.value);
  $('s_neg').oninput=e=>ed(f().neg,'text',e.target.value);
  $('s_size').onchange=e=>{const [w,h]=e.target.value.split('x').map(Number);ed(f().lat.id,'width',w);ed(f().lat.id,'height',h)};
  $('s_steps').oninput=e=>{$('s_q').textContent=e.target.value;ed(f().ks.id,'steps',+e.target.value)};
  $('s_cfg').oninput=e=>{$('s_c').textContent=e.target.value;ed(f().ks.id,'cfg',+e.target.value)};
  $('gen').onclick=()=>{$('rnd').checked=true;run()};
}
function setMode(){ $('simple').hidden=!simple; $('view').hidden=simple; $('mode').textContent=simple?'Advanced view':'Simple view'; if(simple&&view)fillSimple(); else if(view)draw(); }
$('mode').onclick=()=>{simple=!simple;setMode()};
const _open=open_; open_=async function(){await _open(); setMode()};
bindSimple();
list().then(open_);
</script></body></html>
